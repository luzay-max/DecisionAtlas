name: CI B05 password concurrency PG17

on:
  pull_request:
    paths:
      - "services/engine/app/api/auth.py"
      - "services/engine/app/repositories/auth.py"
      - "services/engine/tests/api/test_password_hash_migration.py"
      - "services/engine/tests/api/test_password_hash_migration_concurrency.py"
      - "services/engine/pyproject.toml"
      - "services/engine/uv.lock"
      - "docs/security/password-hash-deployment-rollback.md"
      - "docs/project/self-hosted-operations-runbook.md"
      - ".github/workflows/ci-password-hash-concurrency-pg17.yml"
  push:
    branches:
      - main
    paths:
      - "services/engine/app/api/auth.py"
      - "services/engine/app/repositories/auth.py"
      - "services/engine/tests/api/test_password_hash_migration.py"
      - "services/engine/tests/api/test_password_hash_migration_concurrency.py"
      - "services/engine/pyproject.toml"
      - "services/engine/uv.lock"
      - "docs/security/password-hash-deployment-rollback.md"
      - "docs/project/self-hosted-operations-runbook.md"
      - ".github/workflows/ci-password-hash-concurrency-pg17.yml"

permissions:
  contents: read

jobs:
  password-concurrency-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: b05_ci
          POSTGRES_PASSWORD: b05-ephemeral-ci-only
          POSTGRES_DB: b05_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b05_ci -d b05_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql+psycopg://b05_ci:b05-ephemeral-ci-only@localhost:5432/b05_ci
      DECISIONATLAS_PASSWORD_CONCURRENCY_DATABASE_URL: postgresql+psycopg://b05_ci:b05-ephemeral-ci-only@localhost:5432/b05_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install locked engine dependencies
        run: uv sync --project services/engine --frozen

      - name: Enable pgvector for the current approved schema
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U b05_ci -d b05_ci -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Verify B05 password hash and concurrent login/reset/disable on SQLite and PostgreSQL 17
        working-directory: services/engine
        run: uv run pytest -q tests/api/test_password_hash_migration.py tests/api/test_password_hash_migration_concurrency.py

      # Disposable PostgreSQL 17 only. No production users, credentials, F06b/#34 migration,
      # private sources, or #36 worker lifecycle changes.
