name: Credential backup and recovery rehearsal

# PR #7 is not merged: push on this branch is the trigger until the
# workflow exists on main (workflow_dispatch is then available in the UI).
on:
  push:
    branches:
      - fix/security-bootstrap-webhook-import-20261021
    paths:
      - ".github/workflows/credential-recovery-rehearsal.yml"
      - "scripts/security/rehearse_github_token_recovery.py"
      - "scripts/security/migrate_github_tokens.py"
      - "services/engine/app/security/**"
      - "services/engine/app/repositories/github_token_access_sources.py"
      - "services/engine/uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-credential-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-backup-restore:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install frozen engine dependencies
        run: uv sync --project services/engine --frozen
      - name: Run synthetic offline migration and restore rehearsal
        run: uv run --project services/engine python scripts/security/rehearse_github_token_recovery.py
      - name: Upload summary only, never DB or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-credential-recovery-${{ github.run_number }}
          path: |
            .tmp/security-rehearsal/result.json
            .tmp/security-rehearsal/result.md
          if-no-files-found: warn
          retention-days: 14
