name: B06c generated contract export

on:
  pull_request:
    branches: [main]
    paths:
      - "services/engine/app/api/decision_contract.py"
      - "services/engine/app/api/decisions.py"
      - "packages/engine-contract/**"
      - ".github/workflows/b06c-contract-export.yml"

permissions:
  contents: write

jobs:
  export:
    if: startsWith(github.head_ref, 'feat/b06c-decisions-contract-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync engine environment
        run: uv sync --project services/engine
      - name: Generate Engine OpenAPI DTOs
        run: pnpm contract:generate
      - name: Commit generated contract to the PR branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/engine-contract/openapi.generated.json packages/engine-contract/src/openapi.generated.d.ts
          if git diff --cached --quiet; then
            echo "Generated contract is already current."
          else
            git commit -m "chore(contract): regenerate Decisions DTOs"
            git push origin "HEAD:${BRANCH}"
          fi
      - name: Upload generated contract
        uses: actions/upload-artifact@v4
        with:
          name: b06c-generated-contract
          path: |
            packages/engine-contract/openapi.generated.json
            packages/engine-contract/src/openapi.generated.d.ts
          if-no-files-found: error
          retention-days: 3
