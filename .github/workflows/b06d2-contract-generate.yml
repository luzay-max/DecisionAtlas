name: B06d2 temporary OpenAPI generator

on:
  push:
    branches:
      - feat/b06d2-auth-team-contract-20261109

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Engine environment
        run: uv sync --project services/engine

      - name: Generate OpenAPI schema and TypeScript declarations
        run: pnpm contract:generate

      - name: Commit generated contract files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/engine-contract/openapi.generated.json packages/engine-contract/src/openapi.generated.d.ts
          if git diff --cached --quiet; then
            echo "Generated contracts are already current."
            exit 0
          fi
          git commit -m "chore(contract): regenerate Auth and Team DTOs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
